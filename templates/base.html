{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Student Express{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <link rel="stylesheet" href="{% static 'css/detail.css' %}">
  <link rel="stylesheet" href="{% static 'css/overrides.css' %}">
  <link rel="stylesheet" href="{% static 'css/functionality.css' %}">
</head>
<body>
{% if messages %}<div class="flash-stack">{% for message in messages %}<p class="flash {{ message.tags }}">{{ message }}</p>{% endfor %}</div>{% endif %}
{% block body %}{% endblock %}
<script src="{% static 'js/app.js' %}"></script>
</body>
</html>
